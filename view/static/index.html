<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>kilo workspace</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <header class="app-header">
    <strong>kilo workspace</strong>
    <span class="pill">只读</span>
  </header>
  <div class="shell">
    <div class="miller">
      <section class="col">
        <div class="nav-label">Workspace</div>
        <div id="col-workspace" class="col-body"></div>
      </section>
      <section class="col">
        <div class="nav-label">Project</div>
        <div id="col-project" class="col-body"></div>
      </section>
      <section class="col">
        <div class="nav-label">Line</div>
        <div id="col-line" class="col-body"></div>
      </section>
    </div>
    <main>
      <div id="crumb" class="muted">选择 project</div>
      <iframe id="doc" title="markdown"></iframe>
    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
