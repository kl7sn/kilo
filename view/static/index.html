<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>kilo workspace</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div class="app-body">
    <aside class="rail">
      <div class="rail-group">首页</div>
      <button type="button" id="nav-home" class="rail-item active">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
        项目
      </button>
      <div class="rail-foot"><span class="pill">只读</span></div>
    </aside>
    <div class="stage">
      <section id="home">
        <div class="home-hero" id="home-hero"></div>
        <div class="card-grid" id="card-grid"></div>
      </section>
      <section id="reader" hidden>
        <nav id="crumb" class="crumb-bar" aria-label="路径"></nav>
        <iframe id="doc" title="markdown"></iframe>
      </section>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
