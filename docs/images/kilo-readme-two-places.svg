  <circle cx="118" cy="330" r="8" fill="#E67E30"/>
  <text x="140" y="336" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="600" fill="#262A30">.kilo-state</text>
  <text x="140" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#E67E30">workspace: &lt;vault-path&gt;</text>
  <text x="104" y="460" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6E7680">Binds which line / worktree</text>
  <text x="104" y="486" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6E7680">this repo session advances.</text>

  <!-- Arrow -->
