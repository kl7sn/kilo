  <rect x="72" y="128" width="680" height="560" rx="22" fill="#FFFFFF" stroke="#D6CCC2" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="104" y="160" width="108" height="28" rx="14" fill="#3A3F45"/>
